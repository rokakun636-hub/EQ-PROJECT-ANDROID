
name: Build EQ PROJECT 6.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EQ-PROJECT-6.0-ANDROID-SOURCE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: unzip -o EQ-PROJECT-6.0-ANDROID-SOURCE.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Java and Kotlin target to 17
        run: |
          sed -i '/compileOptions {/,/}/s/VERSION_1_8/VERSION_17/g' app/build.gradle.kts
          sed -i '/compileOptions {/,/}/s/VERSION_8/VERSION_17/g' app/build.gradle.kts
          sed -i '/kotlinOptions {/,/}/s/"1.8"/"17"/g' app/build.gradle.kts
          sed -i '/kotlinOptions {/,/}/s/"8"/"17"/g' app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EQ-PROJECT-6.0-APK
          path: app/build/outputs/apk/debug/*.apk
